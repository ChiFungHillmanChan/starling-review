<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<title>私人頁面</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#d9d6cf;--accent:#1f5f8b;--bad:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#ecebe8;--mute:#a3a19c;--line:#3a3936;--accent:#7fb3da;--bad:#f2b8b5}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 16px;color:var(--mute);font-size:14px}
label{display:block;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.6em;margin:10px 0 0;font-size:14px;color:var(--bad)}
#msg.wait{color:var(--mute)}
.u{position:absolute;left:-9999px;width:1px;height:1px}
</style>
</head>
<body>
<form id="f">
<h1>私人頁面</h1>
<p>呢頁已經加密。入啱密碼之後會喺你部機度解密，密碼唔會傳去任何伺服器。</p>

<label for="pw">密碼</label>
<input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
<button id="go" type="submit">開啟</button>
<div id="msg" role="alert" aria-live="polite"></div>
</form>
